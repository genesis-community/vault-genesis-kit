exodus:
  bosh: base
  ca: <!{meta.vault}/certs/ca:certificate!>
  domain: vault.bosh
  features: ''
  iaas: null
  ips: 10.99.0.16,10.99.0.17,10.99.0.18
  is_director: false
  scale: null
  services: vault
  url: https://10.99.0.16
  use_create_env: false
instance_groups:
- azs:
  - z1
  - z2
  - z3
  instances: 3
  jobs:
  - name: vault
    properties:
      safe:
        peer:
          force_bind_default_ip: true
          tls:
            ca: <!{meta.vault}/certs/ca:certificate!>
            certificate: <!{meta.vault}/certs/consul:certificate!>
            key: <!{meta.vault}/certs/consul:key!>
        tls:
          certificate: <!{meta.vault}/certs/vault:certificate!>
          key: <!{meta.vault}/certs/vault:key!>
        ui: true
    release: safe
  name: vault
  networks:
  - name: vault
    static_ips:
    - 10.99.0.16
    - 10.99.0.17
    - 10.99.0.18
  persistent_disk_type: default
  stemcell: default
  vm_type: default
name: base-vault
releases:
- name: safe
  sha1: sha256:5a5ea100ab6b59d0fea402f80da16f5429dc5f80a3f23bcef3de1bafa141a7f6
  url: https://github.com/cloudfoundry-community/safe-boshrelease/releases/download/v0.3.4/safe-boshrelease-0.3.4.tgz
  version: 0.3.4
stemcells:
- alias: default
  os: ubuntu-jammy
  version: latest
update:
  canaries: 1
  canary_watch_time: 30000-120000
  max_in_flight: 1
  serial: true
  update_watch_time: 30000-120000
