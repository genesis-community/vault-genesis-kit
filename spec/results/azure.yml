exodus:
  bosh: azure
  ca: <!{meta.vault}/certs/ca:certificate!>
  domain: vault.bosh
  features: ''
  iaas: azure
  ips: 10.99.0.16,10.99.0.17,10.99.0.18
  is_director: false
  scale: null
  services: vault
  url: https://10.99.0.16
  use_create_env: false
instance_groups:
- azs:
  - z1
  instances: 3
  jobs:
  - name: vault
    properties:
      safe:
        peer:
          tls:
            ca: <!{meta.vault}/certs/ca:certificate!>
            certificate: <!{meta.vault}/certs/consul:certificate!>
            key: <!{meta.vault}/certs/consul:key!>
        tls:
          certificate: <!{meta.vault}/certs/vault:certificate!>
          key: <!{meta.vault}/certs/vault:key!>
        ui: true
    release: safe
  name: vault
  networks:
  - name: vault
    static_ips:
    - 10.99.0.16
    - 10.99.0.17
    - 10.99.0.18
  persistent_disk_type: default
  stemcell: default
  vm_extensions:
  - test-set
  vm_type: default
name: azure-vault
releases:
- name: safe
  version: 0.3.2+dev.1
stemcells:
- alias: default
  os: ubuntu-jammy
  version: latest
update:
  canaries: 1
  canary_watch_time: 30000-120000
  max_in_flight: 1
  serial: true
  update_watch_time: 30000-120000
