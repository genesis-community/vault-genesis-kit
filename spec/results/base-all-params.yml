exodus:
  bosh: some-other-env
  ca: <!{meta.vault}/certs/ca:certificate!>
  domain: test.domain.com
  features: ''
  iaas: null
  ips: 10.1.1.0,10.1.1.1,10.1.1.2,10.1.1.3,10.1.1.4
  is_director: false
  scale: null
  services: vault
  url: https://10.1.1.0
  use_create_env: false
instance_groups:
- azs:
  - z1
  instances: 5
  jobs:
  - name: vault
    properties:
      safe:
        peer:
          force_bind_default_ip: true
          tls:
            ca: <!{meta.vault}/certs/ca:certificate!>
            certificate: <!{meta.vault}/certs/consul:certificate!>
            key: <!{meta.vault}/certs/consul:key!>
        tls:
          certificate: <!{meta.vault}/certs/vault:certificate!>
          key: <!{meta.vault}/certs/vault:key!>
        ui: false
    release: safe
  name: vault
  networks:
  - name: test-network
    static_ips:
    - 10.1.1.0
    - 10.1.1.1
    - 10.1.1.2
    - 10.1.1.3
    - 10.1.1.4
  persistent_disk_type: test-disk-type
  stemcell: default
  vm_type: test-vm-type
name: base-all-params-vault
releases:
- name: safe
  version: 0.3.2+dev.2
stemcells:
- alias: default
  os: test-stemcell
  version: 9.9.9
update:
  canaries: 1
  canary_watch_time: 30000-120000
  max_in_flight: 1
  serial: true
  update_watch_time: 30000-120000
