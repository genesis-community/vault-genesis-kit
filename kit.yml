---
name:   vault
version: 2.0.0

author:
  - James Hunt   <jhunt@starkandwayne.com>
  - Dennis Bell  <dbell@fivetwenty.io>
  - Kevin Rutten <krutten@fivetwenty>
code:   https://github.com/genesis-community/vault-genesis-kit
docs:   https://genesisproject.io/docs/

genesis_version_min: 3.1.0-rc.9

certificates:
  base:
    certs:
      ca: { valid_for: 10y }
      consul:
        valid_for: 10y
        names:
          - consul_vault_peer
          - 127.0.0.1
      vault:
        valid_for: 2y
        names:
          - "${meta.domain}"
          - 127.0.0.1
